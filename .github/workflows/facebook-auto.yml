name: Fringe Table Facebook Auto

on:
  schedule:
    - cron: '0 11 * * *'
    - cron: '0 16 * * *'
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      slot:
        description: 'Post slot for a manual run'
        required: true
        default: 'morning'
        type: choice
        options:
          - morning
          - afternoon
          - evening

permissions:
  contents: write

concurrency:
  group: fringe-table-facebook-auto
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Resolve posting slot
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SLOT="${{ inputs.slot }}"
          else
            case "${{ github.event.schedule }}" in
              '0 11 * * *') SLOT='morning' ;;
              '0 16 * * *') SLOT='afternoon' ;;
              '0 22 * * *') SLOT='evening' ;;
              *) SLOT='scheduled' ;;
            esac
          fi
          echo "FB_SLOT=$SLOT" >> "$GITHUB_ENV"
      - name: Randomize scheduled post time
        if: github.event_name == 'schedule'
        shell: bash
        run: |
          DELAY_SECONDS=$(( RANDOM % 7141 ))
          DELAY_MINUTES=$(( DELAY_SECONDS / 60 ))
          echo "Random delay: ${DELAY_MINUTES} minute(s)"
          sleep "$DELAY_SECONDS"
      - name: Publish Facebook post
        env:
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
        run: node scripts/facebook-auto.mjs
      - name: Save posting history
        shell: bash
        run: |
          if git diff --quiet -- data/facebook-post-history.json; then
            echo "No Facebook history change to commit."
            exit 0
          fi
          git config user.name "Fringe Table Automation"
          git config user.email "hello@fringetable.com"
          git add data/facebook-post-history.json
          git commit -m "Record Facebook post history"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            echo "History push attempt $attempt failed; retrying after refresh."
            git rebase --abort 2>/dev/null || true
            git fetch origin main
            sleep 3
          done
          echo "Unable to save Facebook history after 3 attempts."
          exit 1
