name: Bump Pronunciation Cache Once
on:
  push:
    branches: [main]
    paths:
      - 'meta/bump-pronunciation-cache-trigger-20260903.txt'
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Refresh pronunciation asset version
        run: node scripts/bump-pronunciation-cache-20260903.mjs
      - name: Commit cache refresh
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No cache changes needed."
            exit 0
          fi
          git config user.name "Fringe Table Automation"
          git config user.email "hello@fringetable.com"
          git add recipes
          git commit -m "Refresh pronunciation asset across recipes"
          git push origin HEAD:main
