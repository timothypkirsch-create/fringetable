name: Region Audit
on:
  push:
    paths:
      - 'scripts/audit-region-counts.mjs'
      - 'assets/js/site-core.js'
      - 'assets/js/site.js'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Count recipes by region
        run: node scripts/audit-region-counts.mjs
