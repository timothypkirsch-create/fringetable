name: Restore Pronunciations Once
on:
  push:
    branches: [main]
    paths:
      - 'meta/restore-pronunciations-trigger-20260902.txt'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Restore pronunciation script to all recipe pages
        run: node scripts/restore-pronunciations-all-recipes.mjs
      - name: Commit restored pronunciations
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No pronunciation changes needed."
            exit 0
          fi
          git config user.name "Fringe Table Automation"
          git config user.email "hello@fringetable.com"
          git add recipes
          git commit -m "Restore pronunciations across all recipes"
          git push origin HEAD:main
