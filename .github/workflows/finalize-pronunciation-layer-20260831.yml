name: Finalize Pronunciation Layer 20260831
on:
  push:
    branches: [main]
    paths:
      - 'scripts/finalize-pronunciation-layer-20260831.mjs'
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Finalize pronunciation layer
        run: node scripts/finalize-pronunciation-layer-20260831.mjs
      - name: Commit pronunciation finalization
        run: |
          git config user.name "Fringe Table Automation"
          git config user.email "actions@users.noreply.github.com"
          git add assets/js/pronunciation.js sitemap.xml
          if git diff --cached --quiet; then
            echo "Pronunciation layer already finalized."
            exit 0
          fi
          git commit -m "Finalize pronunciation glossary integration"
          git push
