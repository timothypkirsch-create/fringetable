name: Fix Verified Recipe Images 20260831
on:
  push:
    branches: [main]
    paths:
      - 'scripts/fix-verified-recipe-images-20260831.mjs'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace confirmed dead image URLs
        run: node scripts/fix-verified-recipe-images-20260831.mjs
      - name: Commit repaired image references
        run: |
          git config user.name "Fringe Table Automation"
          git config user.email "actions@users.noreply.github.com"
          git add assets/js recipes expansion/batches
          if git diff --cached --quiet; then
            echo "No image references needed repair."
            exit 0
          fi
          git commit -m "Replace dead recipe images with verified sources"
          git push
