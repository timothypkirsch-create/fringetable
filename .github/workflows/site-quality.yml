name: Site Quality Gate
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'ads.txt'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'recipes/**'
      - 'assets/js/site-core.js'
      - 'assets/js/pronunciation.js'
      - 'scripts/validate-site.mjs'
      - 'scripts/build-topic-clusters.mjs'
      - 'collections/**'
      - 'data/recipe-url-manifest.txt'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check publisher syntax
        run: node --check scripts/publish-expansion-batch.mjs
      - name: Run site quality gate
        run: node scripts/validate-site.mjs
      - name: Audit regional catalog coverage
        run: node scripts/audit-region-counts.mjs
      - name: Audit deterministic image coverage
        run: node scripts/audit-recipe-images.mjs
