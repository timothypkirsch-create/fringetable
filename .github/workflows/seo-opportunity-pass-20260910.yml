name: Focused Search Console SEO Pass 2026-09-10
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/seo-opportunity-pass-20260910.yml'
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply focused SEO improvements
        run: node scripts/seo-opportunity-pass-20260910.mjs
      - name: Commit SEO improvements
        run: |
          git config user.name "Fringe Table Automation"
          git config user.email "actions@users.noreply.github.com"
          git add .
          git commit -m "Apply focused Search Console SEO improvements" || exit 0
          git push
