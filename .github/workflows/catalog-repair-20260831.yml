name: Catalog Repair 20260831
on:
  push:
    branches: [main]
    paths:
      - 'scripts/catalog-repair-20260831.mjs'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore pre-existing recipe cards to live catalog
        run: node scripts/catalog-repair-20260831.mjs
      - name: Commit catalog repair
        run: |
          git config user.name "Fringe Table Automation"
          git config user.email "actions@users.noreply.github.com"
          git add assets/js/site-core.js
          if git diff --cached --quiet; then
            echo "Catalog already repaired."
            exit 0
          fi
          git commit -m "Restore pre-existing recipe cards to live catalog"
          git push
